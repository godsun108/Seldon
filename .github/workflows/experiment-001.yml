name: Seldon Experiment 001
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/fred_macro_001.py'
      - '.github/workflows/experiment-001.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen macro experiment
        run: PYTHONPATH=. python experiments/fred_macro_001.py
      - name: Preserve experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: seldon-experiment-001
          path: artifacts/experiment_001.json
          retention-days: 30
