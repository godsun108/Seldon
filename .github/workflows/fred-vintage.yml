name: FRED vintage smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'seldon/fred.py'
      - 'experiments/fred_vintage_smoke.py'
      - '.github/workflows/fred-vintage.yml'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  fred-vintage:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify secret is configured
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY repository secret is missing"
            exit 1
          fi
      - name: Pull time-locked FRED/ALFRED macro sample
        run: PYTHONPATH=. python experiments/fred_vintage_smoke.py
      - name: Upload non-secret evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fred-vintage-smoke
          path: artifacts/fred_smoke_summary.json
          retention-days: 14
